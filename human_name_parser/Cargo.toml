[package]
name = "human_name_parser"
version = "0.7.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "human_name_parser"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.29.3"
human_name = "2.0.1"

[features]
extension-module = ["pyo3/extension-module"]
default = ["extension-module"]
