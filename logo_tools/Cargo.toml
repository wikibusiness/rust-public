[package]
name = "logo_tools"
version = "0.1.0"
edition = "2021"

[lib]
name = "logo_tools"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = "0.29.3"

[features]
# maturin enables this (see pyproject.toml); `cargo test` runs without it so
# the test binary links against libpython.
extension-module = ["pyo3/extension-module"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
