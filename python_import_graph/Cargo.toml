[package]
name = "python_import_graph"
version = "0.1.0"
edition = "2021"

[lib]
name = "python_import_graph"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.27"
rayon = "1"
# Not on crates.io; pinned to a ruff release tag. Parses current Python syntax
# (3.14) that older crates.io parsers reject.
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", tag = "0.16.10" }
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.16.10" }

[features]
extension-module = ["pyo3/extension-module"]
default = ["extension-module"]
